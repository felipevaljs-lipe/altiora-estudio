<header class="site-header" [class.is-scrolled]="scrolledSig()" [class.menu-open]="menuOpen()">
  <div class="container bar">
    <a class="brand" href="#inicio" (click)="closeMenu()" aria-label="Altiora Estudio — inicio">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M9 22.5a5.5 5.5 0 0 1-.6-10.97A7 7 0 0 1 22 8.34a5.5 5.5 0 0 1 1.6 10.66"
            fill="url(#en-cloud)"
            opacity="0.18"
          />
          <path
            d="M9 22.5a5.5 5.5 0 0 1-.6-10.97A7 7 0 0 1 22 8.34a5.5 5.5 0 0 1 1.6 10.66"
            stroke="url(#en-cloud)"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M16 14.5v6m0-6-2.2 1.8M16 14.5l2.2 1.8"
            stroke="url(#en-spark)"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <defs>
            <linearGradient id="en-cloud" x1="4" y1="6" x2="28" y2="24" gradientUnits="userSpaceOnUse">
              <stop stop-color="#468189" />
              <stop offset="0.5" stop-color="#77ACA2" />
              <stop offset="1" stop-color="#F4E9CD" />
            </linearGradient>
            <linearGradient id="en-spark" x1="12" y1="13" x2="20" y2="22" gradientUnits="userSpaceOnUse">
              <stop stop-color="#77ACA2" />
              <stop offset="1" stop-color="#F4E9CD" />
            </linearGradient>
          </defs>
        </svg>
      </span>
      <span class="brand-text">
        Altiora<span class="brand-nube">Estudio</span>
      </span>
    </a>

    <nav class="nav-desktop" aria-label="Navegación principal">
      @for (link of links; track link.href) {
        <a [href]="link.href">{{ link.label }}</a>
      }
      <a class="btn btn-primary btn-sm" href="#contacto">Hablemos</a>
    </nav>

    <button
      type="button"
      class="nav-toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Abrir menú"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <div class="nav-mobile" [class.is-open]="menuOpen()">
    <nav aria-label="Navegación móvil">
      @for (link of links; track link.href) {
        <a [href]="link.href" (click)="closeMenu()">{{ link.label }}</a>
      }
      <a class="btn btn-primary" href="#contacto" (click)="closeMenu()">Hablemos</a>
    </nav>
  </div>
</header>
